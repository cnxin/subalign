[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subalign"
version = "0.1.0"
description = "AI-powered subtitle auto-alignment tool for Aegisub"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "click>=8.1",
    "pysubs2>=1.7",
    "faster-whisper>=1.0",
    "ffsubsync>=0.4.25",
    "rapidfuzz>=3.0",
    "rich>=13.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
whisperx = ["whisperx>=3.1"]
openai = ["openai>=1.0"]
full = [
    "whisperx>=3.1",
    "openai>=1.0",
    "librosa>=0.10",
    "silero-vad>=5.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
subalign = "subalign.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/subalign"]

[tool.pytest.ini_options]
testpaths = ["tests"]
